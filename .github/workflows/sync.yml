name: Sync do vinil

# Roda sozinho de 6 em 6 horas. Não é para "atualizar todo dia": é para
# alcançar a janela em que a cota de busca do Spotify volta, que ninguém sabe
# quando é. Execução dentro da espera registrada não faz chamada nenhuma, e
# quando não há espera registrada custa uma busca para descobrir.
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vinil-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar playlists
        run: node sync/sync.mjs
        env:
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YT_DAILY_BUDGET: ${{ vars.YT_DAILY_BUDGET }}
          YT_TRACK_SEARCH: ${{ vars.YT_TRACK_SEARCH }}
      - name: Salvar cache dos matches
        if: always()
        run: |
          git config user.name "vinil-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ || true
          git diff --staged --quiet || (git commit -m "cache: sync diário" && git push)
